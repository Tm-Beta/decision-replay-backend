# Nginx reverse proxy for So I Chose (Cloudflare Full Strict SSL + Real Visitor IP)
# Place Cloudflare Origin Certificate at:
#   /etc/ssl/cloudflare/soichose.pem
#   /etc/ssl/cloudflare/soichose.key

server {
    listen 80;
    listen [::]:80;
    server_name app.soichose.com api.soichose.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.soichose.com;

    ssl_certificate     /etc/ssl/cloudflare/soichose.pem;
    ssl_certificate_key /etc/ssl/cloudflare/soichose.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;
    client_max_body_size 2M;

    # Restore visitor IP behind Cloudflare proxy
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.soichose.com;

    ssl_certificate     /etc/ssl/cloudflare/soichose.pem;
    ssl_certificate_key /etc/ssl/cloudflare/soichose.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;
    # Allows up to 4 MB encrypted .soichose binary backup uploads safely
    client_max_body_size 6M;

    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
